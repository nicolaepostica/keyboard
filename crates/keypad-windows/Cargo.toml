[package]
name = "keypad-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
keypad-core = { version = "0.1.0", path = "../keypad-core" }

[target."cfg(windows)".dependencies]
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
wmi = "0.18.4"
