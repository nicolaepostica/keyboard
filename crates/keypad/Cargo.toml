[package]
name = "keypad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
keypad-core = { version = "0.1.0", path = "../keypad-core" }
keypad-engine = { version = "0.1.0", path = "../keypad-engine" }
keypad-ui = { version = "0.1.0", path = "../keypad-ui" }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
keypad-linux = { version = "0.1.0", path = "../keypad-linux" }

[target."cfg(windows)".dependencies]
keypad-windows = { version = "0.1.0", path = "../keypad-windows" }
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
