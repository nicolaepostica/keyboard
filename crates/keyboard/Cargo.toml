[package]
name = "keyboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
keyboard-core = { version = "0.1.0", path = "../keyboard-core" }
keyboard-engine = { version = "0.1.0", path = "../keyboard-engine" }
keyboard-ui = { version = "0.1.0", path = "../keyboard-ui" }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyboard-linux = { version = "0.1.0", path = "../keyboard-linux" }

[target."cfg(windows)".dependencies]
keyboard-windows = { version = "0.1.0", path = "../keyboard-windows" }
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
