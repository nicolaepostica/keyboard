name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pillow for the asset generator tests
        run: python3 -m pip install --quiet --break-system-packages pillow
      - name: cargo xtask ci
        run: cargo xtask ci

  build:
    name: packages (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Packaging tools (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: cargo xtask package
        run: cargo xtask package

      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=','/LOG=install.log'
          $dir = "$env:LOCALAPPDATA\Programs\keyboard"
          $exe = "$dir\keyboard.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log; throw "keyboard.exe was not installed" }
          Add-Type -Namespace Win -Name Res -MemberDefinition @'
            [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string file, IntPtr h, uint flags);
            [DllImport("kernel32.dll")]
            public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
          '@
          $module = [Win.Res]::LoadLibraryEx($exe, [IntPtr]::Zero, 2) # LOAD_LIBRARY_AS_DATAFILE
          if ([Win.Res]::FindResource($module, [IntPtr]1, [IntPtr]14) -eq [IntPtr]::Zero) { throw "keyboard.exe has no icon" }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "icon: ok, version: $version"
          $help = Start-Process $exe -ArgumentList '--help' -Wait -PassThru
          if ($help.ExitCode -ne 0) { throw "keyboard --help exited with $($help.ExitCode)" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left keyboard.exe behind" }
          Write-Host "install, run, uninstall: ok"
      - name: Check the packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/keyboard_*.deb
          dpkg -s keyboard | grep -E '^(Version|Depends):'
          keyboard --help
          test -f /usr/share/applications/keyboard.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/keyboard.png
          test -f /usr/lib/udev/rules.d/99-keyboard-uinput.rules
          sudo apt-get remove -y keyboard
          if command -v rpm >/dev/null; then rpm -qip dist/*.rpm && rpm -qlp dist/*.rpm; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyboard-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  linux-kernel:
    name: real-kernel test (uinput)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the e2e test
        run: cargo test -p keyboard-linux --test uinput_e2e --no-run
      - name: Run it as root
        run: |
          sudo modprobe uinput
          sudo -E env "PATH=$PATH" cargo test -p keyboard-linux --test uinput_e2e -- --include-ignored
