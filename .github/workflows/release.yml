name: Release

# Push a tag `vX.Y.Z` that matches the workspace version in Cargo.toml:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            exe: keyboard.exe
          - name: linux-x86_64
            os: ubuntu-latest
            exe: keyboard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo build --release
        run: cargo build --release --locked -p keyboard
      - name: Package
        shell: bash
        run: |
          pkg="keyboard-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir -p "$pkg" out
          cp "target/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "$pkg/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -bso0 "out/$pkg.zip" "$pkg"
          else
            tar -czf "out/$pkg.tar.gz" "$pkg"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY"
          --title "keyboard $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
